<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>321互動聖經</title>
<meta name="description" content="和合本．去章節．只留經文——321互動讀經App（繁／简．朗讀．畫線．陪讀）">
<meta name="theme-color" content="#0D3988">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+SC:wght@400;600;700;900&family=Noto+Sans+SC:wght@400;500;600;700&display=swap');

:root{
  /* 繁體、簡體、英文各用自己那一套字型。
     以前整個 App 寫死 Noto Serif TC／Noto Sans TC，那兩套字型裡「沒有」
     簡體才有的字（创、虚、灵、运、开、诸、将、这、结、发、类、树…），
     瀏覽器只好一個字一個字去找別的字型頂替，頂到的通常是黑體，
     於是簡體版一句話裡有的字是明體、有的字是黑體，看起來粗細不一。 */
  --f-serif:"Noto Serif TC","Songti TC","STSong","PMingLiU",Georgia,serif;
  --f-sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;

  --bg:#FBF8F2; --surface:#FFFFFF; --surface-alt:#F2EEE3;
  --ink:#23211C; --ink-soft:#6B6255; --ink-faint:#9B9384;
  --accent:#0D3988; --accent-ink:#0A2C68; --accent-soft:#E7EDF6;
  --gold:#A9762F; --gold-soft:#F5EBD9;
  --border:#E3DDCC; --border-strong:#CFC7B2;
  --good:#3E7D4C; --bad:#B4432F;
  --hlbg-green:#E3F0E1; --hlbg-blue:#E1EBF7; --hlbg-pink:#FBE4E9; --hlbg-purple:#ECE3F5;
  --hlbg-maroon:#F3E1E1; --hlbg-brown:#F0E6D6; --hlbg-charcoal:#E7E6E2;
  --reading:#E7EDF6;
  --shadow: 0 1px 2px rgba(35,33,28,.04), 0 8px 24px -12px rgba(35,33,28,.16);
  --tabbar-h: 62px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161410; --surface:#1E1B16; --surface-alt:#26221B;
    --ink:#ECE6D8; --ink-soft:#B4AB98; --ink-faint:#7C7566;
    --accent:#7FA0DE; --accent-ink:#AFC3EA; --accent-soft:#22314E;
    --gold:#D4A65B; --gold-soft:#332A19;
    --border:#38332A; --border-strong:#4A4436;
    --good:#7BC28C; --bad:#E08A72;
    --hlbg-green:#1F2E1E; --hlbg-blue:#1E2A3D; --hlbg-pink:#3A2229; --hlbg-purple:#2C2438;
    --hlbg-maroon:#332020; --hlbg-brown:#332A1C; --hlbg-charcoal:#2C2C29;
    --reading:#25354F;
  }
}
:root[data-theme="dark"]{
  --bg:#161410; --surface:#1E1B16; --surface-alt:#26221B;
  --ink:#ECE6D8; --ink-soft:#B4AB98; --ink-faint:#7C7566;
  --accent:#7FA0DE; --accent-ink:#AFC3EA; --accent-soft:#22314E;
  --gold:#D4A65B; --gold-soft:#332A19;
  --border:#38332A; --border-strong:#4A4436;
  --good:#7BC28C; --bad:#E08A72;
  --hlbg-green:#1F2E1E; --hlbg-blue:#1E2A3D; --hlbg-pink:#3A2229; --hlbg-purple:#2C2438;
  --hlbg-maroon:#332020; --hlbg-brown:#332A1C; --hlbg-charcoal:#2C2C29;
  --reading:#25354F;
}
/* 羊皮紙（讀經專用暖色） */
:root[data-theme="sepia"]{
  --bg:#F4ECD8; --surface:#FBF5E6; --surface-alt:#EDE3CB;
  --ink:#3A3122; --ink-soft:#6E6047; --ink-faint:#9A8B6E;
  --accent:#12447F; --accent-ink:#0D3566; --accent-soft:#E3EAF4;
  --gold:#96682A; --gold-soft:#EFE1C4;
  --border:#DCCEAC; --border-strong:#C6B48C;
  --reading:#EADFC0;
}

html[lang="zh-Hans"]{
  --f-serif:"Noto Serif SC","Source Han Serif SC","Songti SC","STSong","SimSun",Georgia,serif;
  --f-sans:"Noto Sans SC","PingFang SC","Microsoft YaHei","Heiti SC",sans-serif;
}
html[lang="en"]{
  --f-serif:Georgia,"Times New Roman",serif;
  --f-sans:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{height:100%; max-width:100%; overflow-x:hidden;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--f-sans);
  line-height:1.85; font-size:16px; -webkit-font-smoothing:antialiased;
  padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom));
}
h1,h2,h3,h4{ font-family:var(--f-serif); font-weight:700; color:var(--ink); line-height:1.4; }
a{color:var(--accent)}
button{font-family:inherit;}
[hidden]{display:none!important;}

/* ---------- boot ---------- */
#boot{position:fixed; inset:0; background:var(--bg); z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;}
#boot .spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--accent);animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
#boot .bt{font-size:13px;color:var(--ink-faint);}
#boot-diag{display:none; flex-direction:column; gap:10px; align-items:center; padding:24px; text-align:center; max-width:320px;}
#boot-diag button{padding:10px 18px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink);font-size:14px;}

/* ---------- top bar ---------- */
header.topbar{
  position:sticky; top:0; z-index:20; background:var(--bg);
  border-bottom:1px solid var(--border);
  padding:10px 14px 10px 14px; padding-top:calc(10px + env(safe-area-inset-top));
  display:flex; align-items:center; gap:10px;
}
header.topbar .brand{display:flex; align-items:center; gap:8px; font-family:var(--f-serif); font-weight:900; color:var(--accent); font-size:16px;}
header.topbar .brand img{width:26px;height:26px;border-radius:6px;}
header.topbar .spacer{flex:1;}
.langswitch{display:flex; border:1px solid var(--border-strong); border-radius:999px; overflow:hidden; font-size:11.5px;}
.langswitch button{border:none;background:var(--surface);color:var(--ink-soft);padding:6px 9px;font-weight:600;}
.langswitch button+button{border-left:1px solid var(--border);}
.langswitch button.active{background:var(--accent);color:#fff;}

main#view{max-width:640px; margin:0 auto; padding:16px 16px 84px; min-height:60vh;}

/* ---------- tabbar ---------- */
nav.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:30;
  height:calc(var(--tabbar-h) + env(safe-area-inset-bottom));
  padding-bottom:env(safe-area-inset-bottom);
  background:var(--surface); border-top:1px solid var(--border); display:flex;
}
nav.tabbar a{flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; text-decoration:none; color:var(--ink-faint); font-size:10.5px; font-weight:600;}
nav.tabbar a span{max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
html[lang="en"] nav.tabbar a{font-size:9.5px;}
nav.tabbar a.active{color:var(--accent);}
nav.tabbar a svg{width:20px;height:20px;}

/* ---------- generic ---------- */
.card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:12px; box-shadow:var(--shadow);}
.card h3{margin:0 0 6px; font-size:16px;}
.muted{color:var(--ink-soft); font-size:13.5px;}
.pill{display:inline-block; font-size:11px; font-weight:700; padding:3px 9px; border-radius:999px; background:var(--gold-soft); color:var(--gold);}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border-radius:9px; border:1px solid var(--border-strong); background:var(--surface); color:var(--ink); font-size:14px; font-weight:600; padding:10px 16px; cursor:pointer; text-decoration:none;}
.btn.primary{background:var(--accent); border-color:var(--accent); color:#fff;}
.btn.gold{background:var(--gold); border-color:var(--gold); color:#fff;}
.btn.block{width:100%;}
.btn:active{opacity:.8;}
.btn.sm{padding:7px 12px; font-size:12.5px;}
.hero-cover{position:relative; border-radius:16px; overflow:hidden; margin-bottom:16px; box-shadow:var(--shadow); background:#0D3988; aspect-ratio:1/1; max-height:56vh;}
.hero-cover img{width:100%; height:100%; object-fit:cover; display:block;}
.hero-cover .hc-mask{position:absolute; left:0; right:0; bottom:0; padding:58px 16px 16px; text-align:center;
  background:linear-gradient(to bottom, rgba(6,24,60,0), rgba(6,24,60,.62) 38%, rgba(6,24,60,.9) 66%, rgba(6,24,60,.97));}
.hero-cover .hc-title{color:#F7EFDC; font-family:var(--f-serif); font-size:21px; font-weight:900; letter-spacing:.08em; text-shadow:0 2px 12px rgba(0,0,0,.85), 0 0 26px rgba(6,24,60,.9);}
.hero-cover .hc-sub{color:#E0C88F; font-size:12.5px; margin-top:4px; letter-spacing:.06em; text-shadow:0 1px 8px rgba(0,0,0,.8);}
.section-title{font-size:12px; letter-spacing:.08em; color:var(--gold); font-weight:700; margin:22px 0 8px;}
.section-title:first-child{margin-top:0;}
.rowlink{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border); text-decoration:none; color:var(--ink); cursor:pointer;}
.rowlink:last-child{border-bottom:none;}
.rowlink .meta{flex:1; min-width:0;}
.rowlink .meta .t{font-weight:600; font-size:14.5px;}
.rowlink .meta .s{font-size:12.5px; color:var(--ink-faint);}
.rowlink .chev{color:var(--ink-faint);}
.empty{text-align:center; padding:40px 20px; color:var(--ink-faint); font-size:14px;}
.uitoast{position:fixed; left:50%; bottom:calc(var(--tabbar-h) + 16px + env(safe-area-inset-bottom)); transform:translateX(-50%); background:var(--ink); color:var(--bg); font-size:13px; padding:9px 16px; border-radius:999px; z-index:200; box-shadow:var(--shadow); max-width:88vw; text-align:center;}

/* ---------- 今日 ---------- */
.progwrap{display:flex; align-items:center; gap:14px;}
.progring{width:58px;height:58px;flex:0 0 auto;}
.progring circle{fill:none; stroke-width:6;}
.progring .bgc{stroke:var(--border);}
.progring .fgc{stroke:var(--accent); stroke-linecap:round; transform:rotate(-90deg); transform-origin:50% 50%;}
.progring text{font-size:13px; font-weight:700; fill:var(--ink); font-family:var(--f-sans);}
.daily{font-family:var(--f-serif); font-size:17px; line-height:2; color:var(--ink);}
.dailyref{margin-top:10px; font-size:12.5px; color:var(--gold); font-weight:700;}

/* ---------- 經卷目錄 ---------- */
.grpbar{display:flex; gap:8px; margin-bottom:12px;}
.grpbar button{flex:1; border:1px solid var(--border-strong); background:var(--surface); color:var(--ink-soft); border-radius:999px; padding:8px 0; font-size:13px; font-weight:700; cursor:pointer;}
.grpbar button.on{background:var(--accent); border-color:var(--accent); color:#fff;}
.grp{border:1px solid var(--border); border-radius:12px; margin-bottom:10px; overflow:hidden; background:var(--surface);}
.grp > summary{list-style:none; cursor:pointer; padding:13px 16px; display:flex; align-items:center; gap:10px; font-weight:700; font-size:14.5px;}
.grp > summary::-webkit-details-marker{display:none;}
.grp > summary .cnt{margin-left:auto; font-size:11.5px; color:var(--ink-faint); font-weight:500;}
.bklist{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; padding:4px 12px 14px;}
.bkbtn{border:1px solid var(--border); background:var(--bg); color:var(--ink); border-radius:9px; padding:10px 4px; font-size:13.5px; font-weight:600; cursor:pointer; line-height:1.3;}
.bkbtn:active{background:var(--accent-soft);}
.bkbtn .bs{display:block; font-size:10.5px; color:var(--ink-faint); font-weight:500; margin-top:2px;}
.bkbtn.done{border-color:var(--good);}
.chgrid{display:grid; grid-template-columns:repeat(6,1fr); gap:7px;}
.chbtn{border:1px solid var(--border); background:var(--surface); color:var(--ink); border-radius:8px; padding:10px 0; font-size:13.5px; font-weight:600; cursor:pointer;}
.chbtn.read{background:var(--accent-soft); border-color:var(--accent); color:var(--accent-ink);}
.chbtn.now{background:var(--accent); border-color:var(--accent); color:#fff;}

/* ---------- 閱讀器 ---------- */
.chtoolbar{display:flex; align-items:center; gap:7px; margin-bottom:12px; flex-wrap:wrap;}
.chtb-btn{display:inline-flex; align-items:center; justify-content:center; min-width:36px; height:36px; padding:0 10px; border:1px solid var(--border-strong); background:var(--surface); color:var(--ink); border-radius:9px; font-size:15px; text-decoration:none; cursor:pointer;}
.chtb-btn:active{opacity:.75;}
.chtb-btn[data-state="loading"]{opacity:.6;}
.chtb-btn[data-state="playing"]{background:var(--accent); border-color:var(--accent); color:#fff;}
.chtb-btn.on{background:var(--gold); border-color:var(--gold); color:#fff;}
.chtb-spacer{flex:1;}
.chhead{margin-bottom:20px; text-align:center;}
.chhead .bk{font-family:var(--f-serif); font-size:13px; color:var(--gold); font-weight:700; letter-spacing:.14em;}
.chhead h1{font-size:26px; margin:6px 0 0; font-weight:900; letter-spacing:.06em;}
.chhead h1.bktitle{font-size:28px; letter-spacing:.12em;}
.chhead .rule{width:52px; height:2px; background:var(--gold); margin:12px auto 0; opacity:.55;}
/* 「章節標示：隱藏」只藏章題；整卷連讀時顯示的是卷名，要留著 */
html.nochap .chhead h1.chtitle{display:none;}
html.nochap .chhead h1.chtitle+.rule{margin-top:4px;}
/* 整卷連讀裡的章題：淡雅、置中、寬字距，不打斷閱讀 */
.reader h2.ch{font-family:var(--f-serif); font-size:.8em; font-weight:400;
  color:var(--gold); letter-spacing:.4em; text-align:center; text-indent:0;
  margin:2.2em 0 1.2em; opacity:.85;}
.reader h2.ch:first-child{margin-top:.2em;}
html.nochap .reader h2.ch{display:none;}
.reader{font-family:var(--f-serif);}
.reader p{margin:0 0 16px; font-size:17px; line-height:2.05; text-align:justify;}
.reader p.prose{text-indent:2em;}
/* 詩歌體：懸掛縮排，第二層再退一格 */
.reader p.q1{margin:0 0 4px 1.7em; text-indent:-1.7em; text-align:left;}
.reader p.q2{margin:0 0 4px 3.1em; text-indent:-1.7em; text-align:left;}
/* 詩篇題記（大衛的詩…） */
.reader p.dline{text-indent:0; text-align:center; color:var(--ink-soft); font-size:.92em; margin-bottom:12px;}
.reader .stanza{height:.85em;}
/* 節號：跟章題一起由「章節標示」開關控制 */
.reader .vn{font-family:var(--f-sans); font-size:.6em; font-weight:700;
  color:var(--gold); vertical-align:.5em; margin:0 .18em 0 .1em; letter-spacing:0;}
html.noverse .reader .vn{display:none;}
.reader .note{color:var(--ink-faint); font-size:.86em;}
html.hidenote .reader .note{display:none;}
.chfoot{display:flex; gap:10px; margin:26px 0 8px;}
.chfoot .btn{flex:1;}
.readend{text-align:center; color:var(--ink-faint); font-size:12.5px; margin-top:18px;}

/* ---------- 英文版排版 ---------- */
html[lang="en"] body{font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;}
html[lang="en"] .reader p{text-align:left; hyphens:auto; -webkit-hyphens:auto;}
html[lang="en"] .reader p.prose{text-indent:1.6em;}
html[lang="en"] .reader .vn{margin:0 .22em 0 .06em;}
html[lang="en"] .chhead h1{letter-spacing:0;}
html[lang="en"] .hero-cover .hc-title{letter-spacing:.02em;}
html[lang="en"] .reader h2.ch{letter-spacing:.18em;}

/* ---------- 字級 ---------- */
html.fs-lg .reader p{font-size:19.5px;}
html.fs-xl .reader p{font-size:22px;}
html.fs-xxl .reader p{font-size:24.5px;}
html.fs-lg .chhead h1{font-size:28px;} html.fs-xl .chhead h1{font-size:30px;} html.fs-xxl .chhead h1{font-size:32px;}
html.fs-lg .card h3{font-size:17.5px;} html.fs-xl .card h3{font-size:19.5px;} html.fs-xxl .card h3{font-size:21.5px;}
html.fs-lg .muted{font-size:15px;} html.fs-xl .muted{font-size:17px;} html.fs-xxl .muted{font-size:19px;}
html.fs-lg .rowlink .meta .t{font-size:16px;} html.fs-xl .rowlink .meta .t{font-size:18px;} html.fs-xxl .rowlink .meta .t{font-size:20px;}
html.fs-lg .daily{font-size:19px;} html.fs-xl .daily{font-size:21px;} html.fs-xxl .daily{font-size:23px;}
html.fs-lg .msg{font-size:16.5px;} html.fs-xl .msg{font-size:19px;} html.fs-xxl .msg{font-size:21.5px;}
html.fs-lg .declitem .d,html.fs-lg .hitem .q{font-size:16px;}
html.fs-xl .declitem .d,html.fs-xl .hitem .q{font-size:18px;}
html.fs-xxl .declitem .d,html.fs-xxl .hitem .q{font-size:20px;}

/* ---------- 跟讀高亮：只用顏色，不畫框 ----------
   仍舊用 inset box-shadow 而不是 background，這樣使用者自己畫的線（用 background 畫的）
   與正在朗讀的色塊可以同時看得見，不會互相蓋掉。 */
.reader .sent.tts-reading{
  border-radius:4px;
  box-shadow: inset 0 0 0 999px var(--reading);
  -webkit-box-decoration-break:clone; box-decoration-break:clone;
  transition: box-shadow .22s ease;
}
/* ---------- 書籤模式提示條 ---------- */
.bm-hint{background:var(--gold-soft); color:var(--gold); border:1px solid var(--gold);
  border-radius:9px; padding:9px 12px; font-size:12.5px; line-height:1.6; margin-bottom:14px; text-align:center;}
html.bmmode .reader .sent{cursor:pointer;}
html.bmmode .reader .sent:active{background:var(--gold-soft);}

/* ---------- 書籤 ---------- */
.reader .sent[data-bm]::after{
  content:"🔖"; font-size:.62em; vertical-align:.5em; margin-left:.1em; opacity:.85;
}
/* ---------- 畫線 ---------- */
.reader .sent{cursor:pointer;}
.reader .sent[data-hl]{background:linear-gradient(transparent 58%, var(--gold-soft) 58%); border-radius:2px;}
.reader .sent[data-hl][data-color="green"]{background:linear-gradient(transparent 58%, var(--hlbg-green) 58%);}
.reader .sent[data-hl][data-color="blue"]{background:linear-gradient(transparent 58%, var(--hlbg-blue) 58%);}
.reader .sent[data-hl][data-color="pink"]{background:linear-gradient(transparent 58%, var(--hlbg-pink) 58%);}
.reader .sent[data-hl][data-color="purple"]{background:linear-gradient(transparent 58%, var(--hlbg-purple) 58%);}
.reader .sent[data-hl][data-color="maroon"]{background:linear-gradient(transparent 58%, var(--hlbg-maroon) 58%);}
.reader .sent[data-hl][data-color="brown"]{background:linear-gradient(transparent 58%, var(--hlbg-brown) 58%);}
.reader .sent[data-hl][data-color="charcoal"]{background:linear-gradient(transparent 58%, var(--hlbg-charcoal) 58%);}
.hl-note{margin:-8px 0 16px; padding:8px 12px; background:var(--surface-alt); border-left:3px solid var(--gold); border-radius:6px; font-size:13px; color:var(--ink); white-space:pre-wrap; cursor:pointer; line-height:1.6; font-family:var(--f-sans);}
.hl-note[data-color="green"]{border-left-color:#6FAE71;} .hl-note[data-color="blue"]{border-left-color:#6C93D1;}
.hl-note[data-color="pink"]{border-left-color:#E58FA0;} .hl-note[data-color="purple"]{border-left-color:#A48AC9;}
.hl-note[data-color="maroon"]{border-left-color:#8C4A4E;} .hl-note[data-color="brown"]{border-left-color:#8A6740;}
.hl-note[data-color="charcoal"]{border-left-color:#54534E;}
.hl-hint{background:var(--gold-soft); color:var(--gold); border-radius:8px; padding:9px 12px; font-size:12.5px; line-height:1.6; margin-bottom:14px;}

/* ---------- 底部面板 ---------- */
.hlsheet-mask{position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:400; display:flex; align-items:flex-end;}
.hlsheet-card{background:var(--surface); width:100%; max-height:86vh; overflow-y:auto; border-radius:18px 18px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom)); box-shadow:0 -8px 30px rgba(0,0,0,.25);}
.hlsheet-title{font-size:16px; font-weight:800; color:var(--ink); margin-bottom:10px;}
.hlsheet-quote{display:block; background:var(--gold-soft); color:var(--ink); border-radius:8px; padding:10px 12px; font-size:14px; line-height:1.8; margin-bottom:12px; font-family:var(--f-serif);}
.hlsheet-colorrow{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
.hlsheet-colorlabel{font-size:12.5px; color:var(--ink-soft); white-space:nowrap;}
.hlsheet-colors{display:flex; gap:10px; flex-wrap:wrap;}
.hlswatch{width:28px; height:28px; border-radius:50%; border:2px solid transparent; padding:0; cursor:pointer; box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);}
.hlswatch.active{border-color:var(--ink);}
.spanrow{display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
.spanbtn{min-width:34px; height:30px; padding:0 8px; border-radius:9px; border:1px solid var(--border);
         background:var(--surface); color:var(--ink); font-size:15px; line-height:1; cursor:pointer;}
.spanbtn.wide{font-size:13px; padding:0 10px;}
.spanbtn:active{background:var(--surface-alt);}
.spannum{font-size:13px; color:var(--ink-soft); min-width:42px; text-align:center;}
.hlsheet-ta{width:100%; border:1px solid var(--border-strong); border-radius:10px; padding:10px 12px; font-size:16px; font-family:inherit; resize:vertical; background:var(--surface-alt); color:var(--ink); min-height:84px; margin-bottom:12px;}
.hlsheet-acts{display:flex; gap:10px; margin-bottom:8px;}
.hlsheet-acts .btn{flex:1;}
.hlsheet-acts2{display:flex; gap:8px; flex-wrap:wrap;}
.hlsheet-acts2 .btn{flex:1 1 auto; padding:8px 10px; font-size:12.5px;}
.hlsheet-acts2 .btn.danger{color:var(--bad); border-color:var(--bad);}

/* ---------- 錄製指示燈 ---------- */
.recdot{display:inline-block; vertical-align:middle; margin-right:8px; width:9px; height:9px;
  border-radius:50%; background:var(--bad); animation:recblink 1.1s infinite;}
@keyframes recblink{0%,100%{opacity:1}50%{opacity:.25}}
.btn.danger{color:var(--bad); border-color:var(--bad);}

.cardinput{width:100%; border:1px solid var(--border-strong); border-radius:10px;
  padding:10px 12px; font-size:16px; font-family:inherit; background:var(--surface-alt); color:var(--ink);}

/* ---------- 經文美圖 ---------- */
.cardpv{border-radius:12px; overflow:hidden; background:var(--surface-alt); margin-bottom:14px;
  display:flex; align-items:center; justify-content:center; min-height:120px;}
.holdpv{border-radius:12px; overflow:hidden; background:var(--surface-alt); text-align:center;}
.holdpv img{width:100%; max-height:52vh; object-fit:contain; display:block;
  -webkit-touch-callout:default; -webkit-user-select:auto; user-select:auto;}
.cardpv img{width:100%; max-height:46vh; object-fit:contain; display:block;
  -webkit-touch-callout:default; -webkit-user-select:auto; user-select:auto;}
.cardrow{display:flex; align-items:flex-start; gap:10px; margin-bottom:10px;}
.cardlabel{font-size:12.5px; color:var(--ink-soft); white-space:nowrap; padding-top:7px;}
.cardchips{display:flex; gap:6px; flex-wrap:wrap; flex:1;}
.cardchips button{border:1px solid var(--border-strong); background:var(--surface); color:var(--ink);
  border-radius:8px; padding:6px 11px; font-size:12.5px; font-weight:600; cursor:pointer;}
.cardchips button.on{background:var(--accent); border-color:var(--accent); color:#fff;}

/* ---------- 235 團隊 ---------- */
.tmtitle{font-family:var(--f-serif); font-weight:800; font-size:16px; line-height:1.25; min-width:0;}
.tmtitle .tmkind{display:block; font-family:var(--f-sans); font-size:11px; font-weight:600; color:var(--gold); letter-spacing:.04em;}
.tmavatar{width:38px; height:38px; flex:0 0 auto; border-radius:50%; background:var(--accent-soft); color:var(--accent-ink);
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:16px; font-family:var(--f-serif);}
.tmavatar.sm{width:30px; height:30px; font-size:13px;}
.tmgoal{padding:14px 16px;}
.tmgoalhead{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.tmgoalt{flex:1; font-weight:700; font-size:14.5px; line-height:1.5;}
.tmgoalt.link{color:var(--accent); cursor:pointer; text-decoration:underline; text-decoration-color:var(--border-strong); text-underline-offset:3px;}
.tmbar{height:8px; border-radius:99px; background:var(--surface-alt); overflow:hidden;}
.tmbar i{display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--gold)); border-radius:99px; transition:width .35s;}
.tmfaces{display:flex; gap:10px; flex-wrap:wrap; margin:14px 0 8px;}
.tmface{width:46px; text-align:center; cursor:pointer;}
.tmface span{display:flex; width:40px; height:40px; margin:0 auto 3px; border-radius:50%; align-items:center; justify-content:center;
  background:var(--surface-alt); color:var(--ink-faint); font-weight:800; font-family:var(--f-serif);
  border:2px solid var(--border); font-size:15px;}
.tmface.on span{background:var(--gold-soft); color:var(--gold); border-color:var(--gold);}
.tmface b{display:block; font-size:10.5px; font-weight:600; color:var(--ink-faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.tmface.on b{color:var(--ink);}
.tmcare{border-color:var(--gold); padding:14px 16px;}
.tmcare.ok{border-color:var(--border);}
.tmcareT{font-size:12px; letter-spacing:.08em; color:var(--gold); font-weight:700; margin-bottom:10px;}
.tmcarerow{display:flex; align-items:center; gap:10px; font-size:13.5px; padding:6px 0;}
.tmcarerow > div{flex:1;}
.tmsubs{margin-bottom:12px; overflow-x:auto; flex-wrap:nowrap; padding-bottom:2px;}
.tmsubs button{white-space:nowrap;}
.tmcomp{padding:14px 16px 12px;}
.tmcomp .hlsheet-ta{min-height:76px; margin-bottom:10px;}
.tmpost{padding:14px 16px;}
.tmposthead{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.tmposthead .meta{flex:1; min-width:0;}
.tmposthead .t{font-weight:700; font-size:14px;}
.tmposthead .s{font-size:11.5px; color:var(--ink-faint);}
.tmverse{font-family:var(--f-serif); font-size:14px; line-height:1.9; background:var(--gold-soft);
  border-radius:8px; padding:9px 12px; margin-bottom:10px; color:var(--ink);}
.tmref{display:block; margin-top:4px; font-family:var(--f-sans); font-size:11.5px; color:var(--gold); font-weight:700;}
.tmref.solo{margin-bottom:8px;}
.tmtext{font-size:14.5px; line-height:1.9; white-space:pre-wrap;}
.tmacts{display:flex; gap:4px; margin-top:10px; padding-top:8px; border-top:1px solid var(--border);}
.tmact{border:none; background:transparent; color:var(--ink-faint); font-size:12.5px; padding:4px 9px; border-radius:999px; cursor:pointer; font-family:inherit;}
.tmact.on{color:var(--gold); font-weight:700;}
.tmreplies{margin-top:10px; border-left:3px solid var(--border); padding-left:10px;}
.tmreply{font-size:13px; line-height:1.75; margin-bottom:4px;}
.tmreply b{color:var(--accent); margin-right:6px;}
.tmrepbox{display:flex; gap:8px; margin-top:10px;}
.tmrepbox .cardinput{flex:1;}
.tmmem{display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border);}
.tmmem:last-child{border-bottom:none;}
.tmmem .meta{flex:1; min-width:0;}
.tmmem .t{font-weight:700; font-size:14px;}
.tmmem .s{font-size:12px; color:var(--ink-faint);}
.tmrank{width:22px; text-align:center; font-family:var(--f-serif); font-weight:900; color:var(--gold);}
.tmbadges{margin-top:3px; font-size:14px; letter-spacing:2px;}
.tmbadgelist{display:flex; gap:10px; flex-wrap:wrap;}
.tmbadge{width:78px; text-align:center;}
.tmbadge span{display:block; font-size:26px; line-height:1.4;}
.tmbadge b{display:block; font-size:11px; font-weight:600; color:var(--ink-soft); line-height:1.4;}
.tmrw{padding:14px 16px;}
.tmrwT{font-weight:700; font-size:14.5px;}
.tmgot{margin-top:8px; font-size:12.5px; color:var(--good); font-weight:600;}
select.cardinput{appearance:none; -webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-faint) 50%),linear-gradient(135deg,var(--ink-faint) 50%,transparent 50%);
  background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%; background-size:5px 5px,5px 5px; background-repeat:no-repeat;}

/* ---------- 詩歌庫 ---------- */
.hymnsheet{max-height:88vh;}
.hymnrow{display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--border); cursor:pointer;}
.hymnrow:last-child{border-bottom:none;}
.hymnrow .meta{flex:1; min-width:0;}
.hymnrow .meta .t{font-weight:600; font-size:14.5px;}
.hymnrow .meta .s{font-size:12px; color:var(--ink-faint);}
.hymnrow .chev{color:var(--ink-faint);}
.hymnplay{width:34px; height:34px; flex:0 0 auto; border-radius:50%; border:1px solid var(--border-strong);
  background:var(--surface); color:var(--accent); font-size:13px; cursor:pointer; padding:0;}
.hymnplay:active{background:var(--accent-soft);}

/* ---------- 錄好之後的預覽面板 ---------- */
.rvsheet{max-height:92vh;}
.rvbox{background:#000; border-radius:14px; overflow:hidden; margin-top:4px;}
.rvbox audio{background:var(--surface-2,transparent); display:block;}
.rvbox:has(audio){background:transparent; padding:6px 0;}
.rvacts{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:12px;}
.rvacts .btn{margin:0; padding:12px 8px; font-size:14px;}
.rvacts .btn.danger{color:var(--bad); border-color:var(--bad);}

/* ---------- 免費圖庫 ---------- */
.pxsheet{max-height:90vh;}
.pxbar{display:flex; gap:8px; margin-bottom:10px;}
.pxbar .cardinput{flex:1;}
.pxchips{margin-bottom:12px; max-height:92px; overflow-y:auto;}
.pxgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; min-height:120px;}
.pxcell{position:relative; padding:0; border:2px solid transparent; border-radius:10px; overflow:hidden;
  background:var(--surface-alt); cursor:pointer; aspect-ratio:3/4;}
.pxcell img{width:100%; height:100%; object-fit:cover; display:block;}
.pxcell span{position:absolute; left:0; right:0; bottom:0; padding:12px 5px 3px;
  font-size:9.5px; line-height:1.3; color:#fff; text-align:left; overflow:hidden; white-space:nowrap; text-overflow:ellipsis;
  background:linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,.66));}
.pxcell.on{border-color:var(--gold); opacity:.6;}
@media (min-width:520px){ .pxgrid{grid-template-columns:repeat(4,1fr);} }

/* ---------- 搜尋 ---------- */
.searchbar{display:flex; gap:8px; margin-bottom:12px;}
.searchbar input{flex:1; border:1px solid var(--border-strong); border-radius:10px; padding:11px 13px; font-size:16px; background:var(--surface); color:var(--ink); font-family:inherit;}
.sres{border-bottom:1px solid var(--border); padding:12px 0; cursor:pointer;}
.sres .sr{font-size:12px; color:var(--gold); font-weight:700; margin-bottom:3px;}
.sres .sx{font-size:14px; line-height:1.8; font-family:var(--f-serif);}
.sres em{font-style:normal; background:var(--gold-soft); color:var(--gold); border-radius:3px; padding:0 2px; font-weight:700;}
.sprog{height:4px; background:var(--surface-alt); border-radius:2px; overflow:hidden; margin-bottom:12px;}
.sprog i{display:block; height:100%; background:var(--accent); width:0; transition:width .2s;}

/* ---------- 陪讀 ---------- */
.chatwrap{display:flex; flex-direction:column; height:calc(100vh - 190px);}
.chatlog{flex:1; overflow-y:auto; padding:4px 0 12px;}
.msg{max-width:88%; padding:10px 14px; border-radius:14px; margin-bottom:10px; font-size:14.5px; line-height:1.75;}
.msg.user{background:var(--accent); color:#fff; margin-left:auto; border-bottom-right-radius:4px; white-space:pre-wrap;}
.msg.ai{background:var(--surface-alt); margin-right:auto; border-bottom-left-radius:4px; max-width:94%;}
.msg.ai p{margin:0 0 8px;} .msg.ai p:last-child{margin-bottom:0;}
.msg.ai h4,.msg.ai h5,.msg.ai h6{margin:10px 0 4px; font-size:14.5px; font-weight:700; color:var(--accent-ink);}
.msg.ai b{font-weight:700;} .msg.ai i{font-style:italic;}
.msg.ai blockquote{margin:8px 0; padding:6px 12px; border-left:3px solid var(--gold); background:var(--gold-soft); border-radius:0 8px 8px 0; font-size:14px;}
.msg.ai ul{margin:4px 0 8px; padding-left:20px;} .msg.ai li{margin-bottom:4px;}
.msg.ai hr{border:none; border-top:1px solid var(--border); margin:10px 0;}
.msg.ai .msg-actions{display:flex; flex-wrap:wrap; gap:2px 4px; margin-top:8px; padding-top:6px; border-top:1px solid var(--border);}
.msg.ai .msg-act{border:none; background:transparent; color:var(--ink-faint); font-size:12px; padding:4px 8px; border-radius:999px; cursor:pointer; font-family:inherit;}
.msg.ai .msg-act.on{color:var(--gold); font-weight:700;}
.xz-head{display:flex; align-items:center; gap:8px; margin-bottom:8px;
  font-family:var(--f-serif); font-weight:900; font-size:15px; color:var(--accent);}
.xz-head img{width:24px; height:24px; border-radius:6px;}
.chatctx{font-size:12px; color:var(--ink-faint); background:var(--surface-alt); border-radius:999px; padding:5px 12px; margin-bottom:8px; align-self:flex-start;}
.chatinput{display:flex; gap:8px; padding:10px 0 calc(10px + env(safe-area-inset-bottom)); border-top:1px solid var(--border); background:var(--bg);}
.chatinput textarea{flex:1; resize:none; border:1px solid var(--border-strong); border-radius:10px; padding:10px 12px; font-size:16px; background:var(--surface); color:var(--ink); font-family:inherit; max-height:100px;}
.chatinput button{border:none; background:var(--accent); color:#fff; border-radius:10px; padding:0 16px; font-weight:700;}
.qs-toggle{align-self:flex-start; margin:2px 0 6px; border:1px solid var(--accent); background:var(--accent-soft); color:var(--accent); border-radius:999px; padding:6px 14px; font-size:12.5px; font-weight:700; cursor:pointer;}
.qs-panel{border:1px solid var(--border); border-radius:12px; background:var(--surface-alt); padding:10px; margin-bottom:8px; max-height:40vh; overflow-y:auto; display:flex; flex-direction:column; gap:6px;}
.qs-chip{text-align:left; border:1px solid var(--border-strong); background:var(--surface); color:var(--ink); border-radius:10px; padding:8px 12px; font-size:13px; line-height:1.5; cursor:pointer;}

/* ---------- 我的 ---------- */
.setrow{display:flex; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid var(--border);}
.setrow:last-child{border-bottom:none;}
.setrow .sl{flex:1; font-size:14px;}
.segbtns{display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end;}
.segbtns button{border:1px solid var(--border-strong); background:var(--surface); color:var(--ink); border-radius:8px; padding:6px 11px; font-size:12.5px; font-weight:600; cursor:pointer;}
.segbtns button.on{background:var(--accent); border-color:var(--accent); color:#fff;}
.hitem{border-bottom:1px solid var(--border); padding:12px 0;}
.hitem:last-child{border-bottom:none;}
.hitem .q{font-size:14.5px; line-height:1.85; font-family:var(--f-serif); margin-bottom:6px;}
.hitem .n{font-size:13px; color:var(--ink); background:var(--surface-alt); border-left:3px solid var(--gold); border-radius:6px; padding:7px 10px; margin-bottom:6px; white-space:pre-wrap;}
.hitem .m{font-size:11.5px; color:var(--ink-faint); display:flex; align-items:center; justify-content:space-between; gap:8px;}
.hitem .m button{border:none; background:transparent; color:var(--ink-faint); font-size:12.5px; padding:2px 6px; cursor:pointer;}
.statgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; text-align:center;}
.statgrid .sv{font-family:var(--f-serif); font-size:22px; font-weight:900; color:var(--accent);}
.statgrid .sk{font-size:11.5px; color:var(--ink-faint);}
</style>
</head>
